global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/ai-alerts.yml

scrape_configs:
  - job_name: codebase-memory-admin
    metrics_path: /api/metrics
    static_configs:
      - targets: ["admin:3000"]

  - job_name: knowledge-sync
    metrics_path: /metrics
    static_configs:
      - targets: ["knowledge-sync:3002"]
