worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;

    map $uri $public_rate_limit_key {
        default $binary_remote_addr;
        ~^/(?:_app|static)/ "";
    }

    limit_req_zone $public_rate_limit_key zone=public_per_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Preserva HTTPS quando TLS termina no Cloudflare Tunnel ou em outro proxy.
    map $http_x_forwarded_proto $effective_forwarded_proto {
        default $scheme;
        ~*^https(?:,|$) https;
    }

    # O healthcheck local não publica aplicações para hosts desconhecidos.
    server {
        listen 8080 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 421;
        }
    }

    server {
        listen 8080;
        server_name ${OPENWEBUI_PUBLIC_HOST};
        client_max_body_size 512m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location / {
            limit_req zone=public_per_ip burst=120 nodelay;
            proxy_pass http://open-webui:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }

    server {
        listen 8080;
        server_name ${ADMIN_PUBLIC_HOST};
        client_max_body_size 512m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Health e métricas permanecem disponíveis somente na rede Docker.
        location ~ ^/api/(?:health(?:/.*)?|metrics)$ {
            return 404;
        }

        location = /api/auth/login {
            limit_req zone=login_per_ip burst=5 nodelay;
            proxy_pass http://admin:3000/api/auth/login;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        }

        location / {
            limit_req zone=public_per_ip burst=60 nodelay;
            proxy_pass http://admin:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    server {
        listen 8080;
        server_name ${GRAFANA_PUBLIC_HOST};
        client_max_body_size 512m;

        location / {
            limit_req zone=public_per_ip burst=60 nodelay;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors ${ADMIN_PUBLIC_URL}" always;
            set $grafana_upstream http://grafana:3000;
            proxy_pass $grafana_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    server {
        listen 8080;
        server_name ${MCP_PUBLIC_HOST};
        # Clients may also connect directly via MCP_DIRECT_PORT (default 8081)
        # to bypass this proxy. See compose.yaml agentgateway.ports.
        client_max_body_size 512m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = / {
            limit_req zone=public_per_ip burst=60 nodelay;
            proxy_pass http://agentgateway:${UI_PORT}/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            return 404;
        }
    }
}
